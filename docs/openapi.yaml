        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Chave exigida nas operações de escrita (POST, PUT e DELETE).
  headers:
    XTotalCount:
      description: Total de registros que atendem aos filtros, sem a paginação.
      schema:
        type: integer
        example: 25
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identificador numérico do recurso.
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Número da página.
    Limite:
      name: limite
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Quantidade de registros por página.
    Position:
      name: posicao
      in: query
      schema:
        $ref: '#/components/schemas/Position'
      description: Filtra pela posição.
    Status:
      name: situacao
      in: query
      schema:
        $ref: '#/components/schemas/PlayerStatus'
      description: Filtra pela situação do atleta.
  responses:
    BadRequest:
      description: Requisição inválida (JSON malformado, parâmetros ou campos inválidos).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Dados inválidos
            status: 400
            detail: A requisição possui 1 erro(s) de validação.
            instance: /api/v1/jogadores
            errors:
              - field: number
                message: O número deve estar entre 1 e 99.
    NotFound:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Recurso não encontrado
            status: 404
            detail: O jogador 999 não existe.
            instance: /api/v1/jogadores/999
    Unauthorized:
      description: Chave de API ausente ou inválida.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: ApiKey header="X-API-Key"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Não autenticado
            status: 401
            detail: Informe uma chave de API válida no cabeçalho X-API-Key.
            instance: /api/v1/jogadores
    TooManyRequests:
      description: Limite de requisições atingido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflito com o estado atual (valor único já usado).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Regra de negócio violada (por exemplo, referência a um registro inexistente).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: Detalhes de erro conforme a RFC 9457.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    FacilityType:
      type: string
      enum:
        - CAMPO
        - ACADEMIA
        - PISCINA
        - AUDITORIO
        - SALA_ANALISE
        - DEPARTAMENTO_MEDICO
        - REFEITORIO
        - ALOJAMENTO
    TeamCategory:
      type: string
      enum:
        - MASCULINO
        - FEMININO
    Position:
      type: string
      enum:
        - GOLEIRO
        - ZAGUEIRO
        - LATERAL
        - VOLANTE
        - MEIA
        - ATACANTE
    PreferredFoot:
      type: string
      enum:
        - DIREITO
        - ESQUERDO
        - AMBIDESTRO
    PlayerStatus:
      type: string
      enum:
        - DISPONIVEL
        - EM_TRATAMENTO
        - SUSPENSO
    StaffRole:
      type: string
      enum:
        - AUXILIAR_TECNICO
        - PREPARADOR_FISICO
        - PREPARADOR_GOLEIROS
        - ANALISTA_DESEMPENHO
        - FISIOLOGISTA
        - MEDICO
        - FISIOTERAPEUTA
        - NUTRICIONISTA
        - PSICOLOGO
        - ROUPEIRO
    KitType:
      type: string
      enum:
        - JOGO_1
        - JOGO_2
        - JOGO_3
        - GOLEIRO
        - TREINO
        - VIAGEM
    SessionType:
      type: string
      enum:
        - TATICO
        - TECNICO
        - FISICO
        - REGENERATIVO
        - BOLA_PARADA
    TrainingCenterInput:
      type: object
      required:
        - name
        - city
        - address
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          example: CT Parque Gigante
        city:
          type: string
          minLength: 2
          maxLength: 80
          example: Porto Alegre
        address:
          type: string
          minLength: 3
          maxLength: 200
          example: Av. Padre Cacique, 891, Praia de Belas, Porto Alegre - RS, 90810-240
        areaHa:
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
          maximum: 1000
          example: 7
        openedYear:
          type:
            - integer
            - 'null'
          minimum: 1900
          maximum: 2100
          example: 2005
    TrainingCenterSummary:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/TrainingCenterInput'
        - type: object
          properties:
            facilitiesCount:
              type: integer
              example: 9
            teamsCount:
              type: integer
              example: 1
    TrainingCenterDetail:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/TrainingCenterInput'
        - type: object
          properties:
            facilities:
              type: array
              items:
                $ref: '#/components/schemas/Facility'
            teams:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  category:
                    $ref: '#/components/schemas/TeamCategory'
                  nickname:
                    type:
                      - string
                      - 'null'
    FacilityInput:
      type: object
      required:
        - name
        - type
        - trainingCenterId
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Campo 1
        type:
          $ref: '#/components/schemas/FacilityType'
        capacity:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 10000
          example: 40
        trainingCenterId:
          type: integer
          example: 1
    Facility:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/FacilityInput'
        - type: object
          properties:
            trainingCenter:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                name:
                  type: string
                  example: CT Parque Gigante
    TeamInput:
      type: object
      required:
        - name
        - category
        - trainingCenterId
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          example: Internacional (feminino)
        category:
          $ref: '#/components/schemas/TeamCategory'
        nickname:
          type:
            - string
            - 'null'
          maxLength: 80
          example: Gurias Coloradas
        competitions:
          type: array
          maxItems: 10
          items:
            type: string
          example:
            - Campeonato Brasileiro Feminino A1
            - Campeonato Gaúcho Feminino
        trainingCenterId:
          type: integer
          example: 2
    Team:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 2
        - $ref: '#/components/schemas/TeamInput'
        - type: object
          properties:
            trainingCenter:
              type: object
              properties:
                id:
                  type: integer
                  example: 2
                name:
                  type: string
                  example: CT Morada dos Quero-Queros
            coach:
              type:
                - object
                - 'null'
              properties:
                id:
                  type: integer
                name:
                  type: string
            playersCount:
              type: integer
              example: 25
    PlayerInput:
      type: object
      required:
        - name
        - shirtName
        - number
        - position
        - preferredFoot
        - birthDate
        - teamId
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          example: Carolina Vieira Mattos
        shirtName:
          type: string
          minLength: 2
          maxLength: 40
          example: Carol Vieira
        number:
          type: integer
          minimum: 1
          maximum: 99
          example: 10
        position:
          $ref: '#/components/schemas/Position'
        preferredFoot:
          $ref: '#/components/schemas/PreferredFoot'
        birthDate:
          type: string
          format: date
          description: Não pode estar no futuro.
          example: '1997-07-28'
        status:
          $ref: '#/components/schemas/PlayerStatus'
        teamId:
          type: integer
          example: 2
    Player:
      allOf:
        - type: object
          properties:
            id:
              type: integer
              example: 41
        - $ref: '#/components/schemas/PlayerInput'
        - type: object
          properties:
            team:
              type: object
              properties:
                id:
                  type: integer
                  example: 2
                name:
                  type: string
                  example: Internacional (feminino)
    CoachInput:
      type: object
      required:
        - name
        - nationality
        - contractStart
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          example: Marcelo Antunes Guedes
        nationality:
          type: string
          minLength: 2
          maxLength: 60
          example: Brasil
        license:
          type:
            - string
            - 'null'
          maxLength: 40
          example: CBF Licença PRO
        contractStart:
          type: string
          format: date
          example: '2026-03-10'
        teamId:
          type:
            - integer
            - 'null'
          example: 1
