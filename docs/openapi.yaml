          description: Registro encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coach'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Técnicos
      summary: Atualiza todos os dados de um técnico
      operationId: updateCoach
      security:
        - apiKey: []
      requestBody:
        required: true
