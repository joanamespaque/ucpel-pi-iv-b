        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/times/{id}/uniformes:
    get:
      tags:
        - Times
      summary: Lista os uniformes de um time
      operationId: listTeamKits
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/KitType'
          description: Filtra pelo tipo de uniforme.
        - name: temporada
          in: query
          schema:
            type: integer
            example: 2026
          description: Filtra pela temporada.
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kit'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/times/{id}/treinos:
    get:
      tags:
        - Times
      summary: Lista a agenda de treinos de um time
      operationId: listTeamSessions
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: espacoId
          in: query
          schema:
            type: integer
            minimum: 1
          description: Filtra pelo espaço.
        - name: data
          in: query
          schema:
            type: string
            format: date
          description: Filtra por uma data (AAAA-MM-DD).
        - name: de
          in: query
          schema:
            type: string
            format: date
          description: Data inicial do intervalo (AAAA-MM-DD).
        - name: ate
          in: query
          schema:
            type: string
            format: date
          description: Data final do intervalo (AAAA-MM-DD), igual ou posterior a `de`.
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingSession'
