openapi: 3.1.0
info:
  title: InterCT API
  version: 1.0.0
  summary: API REST para a organização do centro de treinamento do Sport Club Internacional.
  description: |
    API desenvolvida no Projeto Integrador IV-B (UCPel) para organizar os
    centros de treinamento do Sport Club Internacional: espaços, times
    principais (masculino e feminino), elencos, técnicos e comissões técnicas,
    uniformes e a agenda de treinos.

    **Dados ilustrativos:** a estrutura dos CTs reproduz informações públicas
    do clube, mas os nomes de jogadores e profissionais são fictícios.

    Todas as respostas usam JSON. Erros seguem o formato Problem Details
    (RFC 9457), com o tipo de mídia `application/problem+json`.

    **Autenticação:** as consultas (GET) são públicas. As operações que
    alteram dados (POST, PUT e DELETE) exigem uma chave de API no cabeçalho
    `X-API-Key`; sem ela, a resposta é 401.

    **Paginação:** as listagens de jogadores, espaços, comissão técnica,
    uniformes e treinos aceitam `pagina` (padrão 1) e `limite` (padrão 50,
    máximo 100). O total de registros vem no cabeçalho `X-Total-Count`.

    **Limite de requisições:** 300 requisições a cada 15 minutos por IP, das
    quais no máximo 30 de escrita. Acima disso, a resposta é 429.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://interct-api.onrender.com
    description: Produção (Render)
  - url: http://localhost:3000
    description: Ambiente local
tags:
  - name: CTs
    description: Centros de treinamento.
  - name: Espaços
    description: Campos, academia, departamento médico e demais espaços dos CTs.
  - name: Times
    description: Times principais, elencos, uniformes e agenda.
  - name: Jogadores
    description: Cadastro de jogadores e jogadoras.
  - name: Técnicos
    description: Técnicos vinculados aos times.
  - name: Comissão técnica
    description: Profissionais que trabalham com cada técnico.
  - name: Uniformes
    description: Uniformes de jogo, treino e viagem por temporada.
  - name: Treinos
    description: Agenda de treinos por time, espaço e horário.
  - name: Infraestrutura
    description: Estado da API.
paths:
  /health:
    get:
      tags:
        - Infraestrutura
      summary: Verifica a API e a conexão com o banco
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API e banco disponíveis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.0.0
        '503':
          description: Banco de dados indisponível.
  /api/v1/cts:
    get:
      tags:
        - CTs
      summary: Lista os centros de treinamento
      operationId: listTrainingCenters
      security: []
      responses:
        '200':
          description: Registros encontrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingCenterSummary'
    post:
      tags:
        - CTs
      summary: Cadastra um CT
      operationId: createTrainingCenter
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingCenterInput'
      responses:
        '201':
          description: Registro criado. O cabeçalho `Location` aponta para o novo recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingCenterSummary'
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/cts/3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/cts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - CTs
      summary: Detalha um CT
      operationId: getTrainingCenter
      security: []
      responses:
        '200':
          description: Registro encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingCenterDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - CTs
      summary: Atualiza todos os dados de um CT
      operationId: updateTrainingCenter
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingCenterInput'
      responses:
        '200':
          description: Registro atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingCenterDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - CTs
      summary: Remove um CT que não sedia times
      operationId: deleteTrainingCenter
      security:
        - apiKey: []
      responses:
        '204':
          description: Registro removido.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          description: O CT ainda sedia times.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/cts/{id}/espacos:
    get:
      tags:
        - CTs
      summary: Lista os espaços de um CT
      operationId: listTrainingCenterFacilities
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/FacilityType'
          description: Filtra pelo tipo de espaço.
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
      responses:
        '200':
          description: Lista paginada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facility'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/espacos:
