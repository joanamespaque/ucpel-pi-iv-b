          $ref: '#/components/responses/Unprocessable'
      description: O espaço deve pertencer ao CT do time e o uniforme, quando informado, deve ser do próprio time (422). Dois treinos
        não podem ocupar o mesmo espaço em horários sobrepostos na mesma data (409).
