                items:
                  $ref: '#/components/schemas/Facility'
          headers:
            X-Total-Count:
              $ref: '#/components/headers/XTotalCount'
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
        - name: ctId
          in: query
          schema:
            type: integer
            minimum: 1
          description: Filtra pelo CT.
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/FacilityType'
          description: Filtra pelo tipo de espaço.
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Limite'
    post:
      tags:
        - Espaços
      summary: Cadastra um espaço
      operationId: createFacility
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityInput'
      responses:
        '201':
          description: Registro criado. O cabeçalho `Location` aponta para o novo recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/espacos/16
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/espacos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Espaços
      summary: Detalha um espaço
      operationId: getFacility
