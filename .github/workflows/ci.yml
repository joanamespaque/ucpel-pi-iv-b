name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (lint e testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interct
          POSTGRES_PASSWORD: interct
          POSTGRES_DB: interct_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interct"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - name: Valida a especificação OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint openapi/openapi.yaml --skip-rule operation-4xx-response --skip-rule no-server-example.com

  client:
    name: Cliente PHP (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: find src public views -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t interct-api ./api
      - run: docker build -t interct-client ./client
